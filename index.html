<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121411" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zombie Idle" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Zombie Idle</title>
</head>
<body>
  <div id="app" class="tall">
    <header id="hud">
      <div class="hud-dna"><span id="hud-vial"></span><b id="hud-dna">0</b><small id="hud-rate">+0/s</small></div>
      <div class="hud-tier">TIER <b id="hud-tier">1</b></div>
      <div id="hud-keep" class="keep-pill">keeping up</div>
      <button id="hud-settings" class="icon-btn" data-action="settings" aria-label="Settings">⚙</button>
    </header>
    <main id="field" aria-label="Battlefield"></main>
    <section id="panel">
      <div id="tab-body"></div>
      <nav id="tabs" role="tablist">
        <button data-action="tab" data-arg="zombies" role="tab"><span class="ti">☣</span>Zombies</button>
        <button data-action="tab" data-arg="squad" role="tab"><span class="ti">✚</span>Squad</button>
        <button data-action="tab" data-arg="tree" role="tab"><span class="ti">✦</span>Tree</button>
        <button data-action="tab" data-arg="hordes" role="tab"><span class="ti">⚑</span>Hordes</button>
      </nav>
    </section>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal" hidden></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
