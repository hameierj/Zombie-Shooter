<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121411" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zombie Idle" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Zombie Idle</title>
</head>
<body>
  <div id="app" class="tall">
    <header id="hud">
      <div id="hud-dna" class="hud-dna"></div>
      <div id="hud-keep" class="keep-pill">keeping up</div>
      <button id="hud-sound" class="icon-btn" data-action="sound" aria-label="Sound on or off">🔊</button>
      <button id="hud-settings" class="icon-btn" data-action="settings" aria-label="Settings">⚙</button>
    </header>
    <main id="field" aria-label="Battlefield"></main>
    <section id="panel" hidden>
      <div class="panel-head"><h2 id="panel-title"></h2><button class="btn ghost close" data-action="close">✕ Back to map</button></div>
      <div id="tab-body"></div>
    </section>
    <nav id="tabs" role="tablist">
        <button data-action="tab" data-arg="zombies" role="tab"><span class="ti">☣</span>Zombies</button>
        <button data-action="tab" data-arg="squad" role="tab"><span class="ti">✚</span>Squad</button>
        <button data-action="tab" data-arg="tree" role="tab"><span class="ti">✦</span>Tree</button>
        <button data-action="tab" data-arg="hordes" role="tab"><span class="ti">⚑</span>Hordes</button>
    </nav>
    <div id="toasts" aria-live="polite"></div>
    <div id="combo" hidden><b>COMBO <span id="combo-n">0</span></b><span id="combo-x">×1.00 DNA</span><i><em id="combo-bar"></em></i></div>
    <div id="modal" hidden></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
